name: Source checks

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source:
    name: Source / ${{ matrix.group }} (not release qualification)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: rust
            os: ubuntu-24.04
          - group: gameplay
            os: ubuntu-24.04
          # The fake import harness still calls xcode-select to locate Python.
          - group: tooling
            os: macos-15
          - group: assets
            os: ubuntu-24.04
          - group: audio
            os: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: 2
      RUSTUP_AUTO_INSTALL: 0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          lfs: ${{ matrix.group != 'rust' && matrix.group != 'gameplay' }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            scripts/requirements.txt
            scripts/audio/requirements.txt
            scripts/qualification/source-checks-requirements.txt
      - name: Install pinned Python source-check dependencies
        run: python -m pip install -r scripts/qualification/source-checks-requirements.txt
      - name: Install the repository Rust pin
        if: matrix.group == 'rust'
        run: |
          channel="$(python -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')"
          rustup toolchain install "$channel" --profile minimal --component rustfmt --component clippy
      - name: Run selected source checks
        run: python scripts/qualification/source_checks.py --group '${{ matrix.group }}' --output 'Saved/SourceChecks/ci-${{ matrix.group }}'
      - name: Preserve logs and partial or failed results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: source-checks-${{ matrix.group }}
          path: Saved/SourceChecks/ci-${{ matrix.group }}/
          if-no-files-found: warn
          retention-days: 14
