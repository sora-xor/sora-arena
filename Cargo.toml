[workspace]
members = ["crates/arena-core", "crates/arena-ffi", "crates/arena-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[profile.release]
overflow-checks = true
lto = "thin"
codegen-units = 1
