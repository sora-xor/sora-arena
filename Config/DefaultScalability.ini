; Windows competitive: High shadow quality uses conventional direct lighting.
; Epic shadow quality is the Windows visual-quality tier with MegaLights.
[ShadowQuality@2]
r.MegaLights.Allow=0

[ShadowQuality@3]
r.MegaLights.Allow=1

; Motion blur stays disabled in both FPS tiers regardless of engine defaults.
[PostProcessQuality@2]
r.MotionBlurQuality=0
r.DepthOfFieldQuality=0

[PostProcessQuality@3]
r.MotionBlurQuality=0
