; Mac rendering baseline. Lumen and TSR remain enabled in DefaultEngine.ini.
; Nanite runs only on METAL_SM6 (Apple8 GPUs: M2 and later). M1 runs METAL_SM5,
; where ProxyRenderMode=0 draws each Nanite mesh's conventional fallback, so
; fallbacks, LODs and card fur must still be authored with the assets.
; Virtual shadow maps stay off until they are measured on METAL_SM6.
[/Script/Engine.RendererSettings]
r.RayTracing=False
r.MegaLights.Supported=0
r.MegaLights=0
r.Nanite.ProxyRenderMode=0
r.Shadow.Virtual.Enable=0
